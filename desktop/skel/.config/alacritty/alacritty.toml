# Alacritty fedoriri — le thème vit dans theme.toml (géré par
# fedoriri-theme-set) ; alacritty recharge sa config à chaud.

[general]
import = ["~/.config/alacritty/theme.toml"]
live_config_reload = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"

[window]
decorations = "None"

[window.padding]
x = 8
y = 8
