# Clés appliquées à $ICAROOT/config/All_Regions.ini par install-citrix.sh
# (format : Section/Clé=Valeur, idempotent). Vide par défaut : All_Regions.ini
# gouverne la CONFIANCE par région et les valeurs livrées par Citrix sont
# saines. Exemples, à décommenter en connaissance de cause :
#
# Autoriser le presse-papiers dans les deux sens (déjà le défaut usuel) :
#Virtual Channels\Clipboard/AllowClipboard=true
#
# Lecture seule des lecteurs mappés :
#Virtual Channels\Drive Mapping/ReadOnlyMappedDrive=true
