; wfclient.ini fedoriri — déployé dans /etc/skel/.ICAClient/ par
; install-citrix.sh (le client le complète au premier lancement).
;
; Mono-moniteur (défaut) : plein écran classique, la window-rule niri
; (open-fullscreen) fait le reste.
;
; REPLI MULTI-MONITEURS (voir docs/limites.md — le plein écran Citrix sur
; deux moniteurs via xwayland-satellite est probablement impossible, un
; Xwayland rootless n'exposant qu'une géométrie par fenêtre) :
; décommenter les deux clés ci-dessous et lancer UNE session par moniteur
; avec WFICA_OPTS="-span 1" (liste des moniteurs : WFICA_OPTS="-span h" wfica).
; UseFullScreen=False laisse le compositeur gérer le plein écran ; TWIMode=0
; désactive le mode transparent (seamless), inutile sous niri.

[WFClient]
Version=2
;UseFullScreen=False
;TWIMode=0
; Le clavier suit la disposition du serveur X (ch-fr via niri/xkb).
KeyboardLayout=(User Profile)
